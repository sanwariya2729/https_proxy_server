# Secure HTTP Proxy Policy Configuration
# Format: key=value

# Default policy: allow or deny
default_policy=deny

# Allowed domains (exact match and subdomains)
allow_domain=example.com
allow_domain=httpbin.org
allow_domain=localhost

# Blocked domains (takes precedence over allow)
block_domain=blocked.example

# Allowed ports
allow_port=80
allow_port=8080
allow_port=9000

# Maximum connections
max_connections=50

# Timeouts (in seconds)
header_timeout=10
connect_timeout=5
upstream_timeout=30

# Resource limits
max_header_bytes=16384
max_queue_size=100
